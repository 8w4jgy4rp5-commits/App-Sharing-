<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Company News Feed | CobbleWorks</title>
    <link rel="stylesheet" href="style.css" />
  <!-- cobbleworks:seo:start -->
    <meta name="description" content="Get the latest news for any company." />
    <link rel="canonical" href="https://8w4jgy4rp5-commits.github.io/App-Sharing-/apps/news-feed/" />
    <link rel="stylesheet" href="../../app-footer.css" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Company News Feed" />
    <meta property="og:description" content="Get the latest news for any company." />
    <meta property="og:url" content="https://8w4jgy4rp5-commits.github.io/App-Sharing-/apps/news-feed/" />
    <meta property="og:image" content="https://8w4jgy4rp5-commits.github.io/App-Sharing-/og-image.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
  <!-- cobbleworks:seo:end -->
  </head>
  <body>

    <header>
      <h1 data-i18n="title">Company News Feed</h1>
      <p data-i18n="subtitle">Get the latest news for any company.</p>
      <button id="changeApiKeyBtn" class="link-btn" style="display:none" data-i18n="changeApiKey">Change API key</button>
    </header>

    <main>

      <!-- API key setup (stored only in this browser, never in the app's code) -->
      <section id="api-key-section" class="api-key-section">
        <p data-i18n="apiKeyIntro">To use this app, enter your own free GNews API key. It's saved only in your browser, never sent anywhere else.</p>
        <div id="api-key-row">
          <input
            type="password"
            id="apiKeyInput"
            data-i18n-placeholder="apiKeyInputPlaceholder"
            placeholder="Paste your GNews API key"
            data-i18n-aria-label="apiKeyInputAriaLabel"
            aria-label="GNews API key"
          />
          <button id="saveApiKeyBtn" data-i18n="saveApiKey">Save</button>
        </div>
        <p class="api-key-hint">
          <span data-i18n="apiKeyHintPrefix">Don't have one?</span>
          <a href="https://gnews.io/register" target="_blank" rel="noopener noreferrer" data-i18n="apiKeyHintLink">Get a free key</a><span data-i18n="apiKeyHintSuffix">.</span>
        </p>
      </section>

      <!-- Search -->
      <section id="search-section">
        <div id="search-row">
          <input
            type="text"
            id="queryInput"
            data-i18n-placeholder="queryInputPlaceholder"
            placeholder="Search company name (e.g. Apple, Tesla)"
            data-i18n-aria-label="queryInputAriaLabel"
            aria-label="Company name to search"
          />
          <button id="searchBtn" data-i18n="search">Search</button>
        </div>

        <!-- Companies from Watchlist app (auto-populated) -->
        <div id="watchlist-picks" style="display:none">
          <span class="picks-label" data-i18n="watchlistLabel">From your watchlist:</span>
          <div id="watchlist-buttons"></div>
        </div>
      </section>

      <!-- Article results appear here -->
      <section id="results-section">
        <div id="resultsArea"></div>
      </section>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../supabase-config.js"></script>
    <script src="../../app-sync.js"></script>
    <script src="script.js"></script>
  <!-- cobbleworks:footer:start -->
    <footer class="cw-footer">
      <a href="../../">Made on CobbleWorks — browse other mini apps</a>
    </footer>
  <!-- cobbleworks:footer:end -->
  </body>
</html>
