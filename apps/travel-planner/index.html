<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Travel Planner</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231d4e89'/%3E%3Ccircle cx='16' cy='16' r='10' fill='none' stroke='%23ffffff' stroke-width='1.6'/%3E%3Cpolygon points='16,8 19,16 16,24 13,16' fill='%23e8944a'/%3E%3Ccircle cx='16' cy='16' r='1.6' fill='%23ffffff'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="authGate" class="gate">
      <svg class="gate-stamp" viewBox="0 0 120 120" aria-hidden="true">
        <circle cx="60" cy="60" r="50" fill="none" stroke="currentColor" stroke-width="3" stroke-dasharray="6 5" />
        <circle cx="60" cy="60" r="38" fill="none" stroke="currentColor" stroke-width="1.5" />
      </svg>
      <h1>
        <svg class="logo-icon" viewBox="0 0 32 32" aria-hidden="true">
          <rect width="32" height="32" rx="8" fill="#1d4e89" />
          <circle cx="16" cy="16" r="10" fill="none" stroke="#fff" stroke-width="1.6" />
          <polygon points="16,8 19,16 16,24 13,16" fill="#e8944a" />
          <circle cx="16" cy="16" r="1.6" fill="#fff" />
        </svg>
        Travel Planner
      </h1>
      <p>Plan every trip's days, stays, transport, costs, and links in one place. Sign in to get started.</p>
      <button id="signInBtn" type="button">Sign in with Google</button>
    </div>

    <div id="app" hidden>
      <header class="app-header">
        <div class="header-inner">
          <h1>
            <svg class="logo-icon" viewBox="0 0 32 32" aria-hidden="true">
              <rect width="32" height="32" rx="8" fill="#1d4e89" />
              <circle cx="16" cy="16" r="10" fill="none" stroke="#fff" stroke-width="1.6" />
              <polygon points="16,8 19,16 16,24 13,16" fill="#e8944a" />
              <circle cx="16" cy="16" r="1.6" fill="#fff" />
            </svg>
            Travel Planner
          </h1>
          <p class="subtitle">Plan every trip's days, stays, transport, costs, and links in one place.</p>
        </div>
        <button id="signOutBtn" class="link-btn" type="button">Sign out</button>
      </header>

      <main>
        <p id="loadingIndicator" class="loading-indicator">Loading your trips…</p>

        <div id="mainContent" hidden>
          <!-- Trip list view -->
          <section id="tripListView">
            <section id="new-trip-section">
              <form id="newTripForm">
                <div class="form-group">
                  <label for="newTripName">Trip name</label>
                  <input id="newTripName" type="text" placeholder="e.g. Spain Trip 2026" required />
                </div>
                <button type="submit">+ New trip</button>
              </form>
            </section>

            <section id="trips-section">
              <h2>Your trips</h2>
              <div id="tripList"><!-- trip cards injected by script.js --></div>
              <div id="tripsEmptyState" class="empty-state" hidden>
                <svg class="stamp-illustration" viewBox="0 0 120 120" aria-hidden="true">
                  <circle cx="60" cy="60" r="50" fill="none" stroke="currentColor" stroke-width="3" stroke-dasharray="6 5" />
                  <circle cx="60" cy="60" r="38" fill="none" stroke="currentColor" stroke-width="1.5" />
                  <text x="60" y="55" text-anchor="middle" font-size="13" font-weight="bold" fill="currentColor">NO TRIPS</text>
                  <text x="60" y="72" text-anchor="middle" font-size="13" font-weight="bold" fill="currentColor">YET</text>
                </svg>
                <p>No trips yet. Create your first trip above!</p>
              </div>
            </section>
          </section>

          <!-- Trip detail view -->
          <section id="tripDetailView" hidden>
            <button id="backToListBtn" type="button" class="link-btn">&larr; Back to trips</button>

            <div class="trip-detail-header">
              <div class="form-group">
                <label for="tripNameInput">Trip name</label>
                <input id="tripNameInput" type="text" required />
              </div>
              <div class="trip-total">
                <span class="trip-total-label">Total cost</span>
                <span id="tripTotalCost" class="trip-total-value">¥0</span>
              </div>
            </div>

            <div id="dayList"><!-- day cards injected by script.js --></div>

            <div class="detail-actions">
              <button id="addDayBtn" type="button" class="secondary-btn">+ Add day</button>
              <button id="deleteTripBtn" type="button" class="danger-btn">Delete this trip</button>
            </div>
          </section>
        </div>
      </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../supabase-config.js"></script>
    <script src="../../app-sync.js"></script>
    <script src="script.js"></script>
  </body>
</html>
