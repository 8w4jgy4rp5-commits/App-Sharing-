<!doctype html><meta charset="utf-8"><title>Tiger face studies</title>
<style>
 body{margin:0;background:#F6F1E8;font:15px/1.6 system-ui,sans-serif;color:#3A2A22;padding:28px}
 h1{font-size:20px;margin:0 0 4px}p.sub{margin:0 0 22px;color:#7A6357}
 .row{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px}
 figure{margin:0;background:#fff;border:1px solid #E3D8C9;border-radius:14px;padding:14px}
 figure img{width:100%;display:block}
 figcaption{margin-top:8px;font-size:13px;color:#7A6357}
 b{color:#1F6B4D}
</style>
<h1>顔スタディ a → e（ジョジョ方向・3/4でこちらを睨む）</h1>
<p class="sub">体は真横のまま、顔だけ振り向かせる想定。eが現時点の最良。</p>
<div class="row">
  <figure><img src="face-a.png"><figcaption>a — 正面気味。完全に「お面」</figcaption></figure>
  <figure><img src="face-b.png"><figcaption>b — 3/4にしたが模様が多すぎて部族マスク</figcaption></figure>
  <figure><img src="face-c.png"><figcaption>c — 首を付けた。眉が太すぎて目が潰れた</figcaption></figure>
</div>
<div class="row" style="margin-top:18px">
  <figure><img src="face-d.png"><figcaption>d — <b>輪郭を曲線に / 角張らせるのは影と模様だけ</b> に変更。ここで一気に良くなった</figcaption></figure>
  <figure><img src="face-e.png"><figcaption><b>e（現時点の最良）</b> — 眉を細く、目を細く、口を大きく、鼻を小さく</figcaption></figure>
  <figure style="display:flex;align-items:center;justify-content:center;color:#7A6357;font-size:14px">
    <div style="padding:20px">
      <b style="color:#B3452C">eに残っている問題</b>
      <ul style="padding-left:18px;margin:10px 0 0">
        <li>鼻がまだ大きく、口の白い部分を潰している</li>
        <li>奥側（右）が茶色く濁って形が読めない</li>
        <li>輪郭が丸すぎる（頬骨の角が欲しい）</li>
        <li>牙が白い楕円で、噛む形をしていない</li>
      </ul>
    </div>
  </figure>
</div>
