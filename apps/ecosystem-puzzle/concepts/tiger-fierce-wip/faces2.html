<h1>こわもてトラ — 現状</h1>
<p class="sub">体は真横のまま、顔だけこちらを振り向かせた3/4。</p>

<h2>全身（最新 v10）</h2>
<div class="row one">
  <figure><img src="tiger-v10.png"><figcaption><b class="ok">tiger-v10</b>／縞の暴発と後脚の白流入を修正、脚にリング追加、3/4の顔を接続</figcaption></figure>
</div>

<h2>顔 — 今日の直し</h2>
<p class="sub" style="margin-bottom:14px">左から時系列。<b>l が最新</b>。</p>
<div class="row">
  <figure class="old"><img src="face-i.png"><figcaption>i（昨日の最良）／マズルが<b class="bad">奥側にずれて貼ってある</b></figcaption></figure>
  <figure><img src="face-j.png"><figcaption>j／マズルを顔の中心軸へ。口の線を引いて、手前の端だけ上げた冷笑に</figcaption></figure>
  <figure><img src="face-k.png"><figcaption>k／マズルを22px下げて鼻筋を伸ばし、顎を細く短く</figcaption></figure>
  <figure><img src="face-l.png"><figcaption><b class="ok">l ＝ 最新</b>／顎下の影の帯（二重顎に見えていた）を削除。頬のふさのトゲも丸めた</figcaption></figure>

  <figure class="old"><img src="face-e.png"><figcaption>e（牙を剥く方向＝不採用）</figcaption></figure>

<div class="note">
  <b class="bad">v10 に残っている問題（自己診断）</b>
  <ul>
    <li>顔は l に差し替え予定（v10 はまだ i の顔）</li>
    <li>頭と首の継ぎ目が見える。頬の毛を首に溶け込ませたい</li>
    <li>顎の下が尖って突き出ていて不自然</li>
    <li>縞が腹の上で止まって、腹の横に無地の帯が残っている</li>
    <li>奥の脚と手前の脚の区別が弱い</li>
  </ul>
