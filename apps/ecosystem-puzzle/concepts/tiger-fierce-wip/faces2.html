<h1>こわもてトラ — 顔スタディ</h1>
<p class="sub">体は真横のまま、顔だけこちらを振り向かせる3/4。<b class="ok">h が現時点の最良</b>。</p>

<div class="row">
  <figure><img src="face-h.png"><figcaption><b class="ok">h ＝ 現時点の最良</b>／面長に、目を横に長く細く、影を削り出しに</figcaption></figure>
  <figure><img src="face-g.png"><figcaption>g／口を水平＋片端上げの冷笑に。眉を独立した形で追加</figcaption></figure>
  <figure><img src="face-f.png"><figcaption>f／方向転換の1発目。口がへの字で「不機嫌」に見える</figcaption></figure>
</div>

      <li>冷たさが足りない。まだ眠そうな猫寄り</li>
