    <path d="M186 332 C224 340,262 354,282 372 C248 372,206 362,182 348 Z"/>
    <path d="M196 388 C232 394,266 402,286 414 C252 418,214 410,192 400 Z"/>
    <path d="M120 186 C142 218,150 256,142 292 C122 262,110 220,108 188 Z"/>
