    <path d="M208 104 C236 152,244 214,228 266 C202 220,192 152,190 100 Z"/>
    <path d="M278 96 C302 138,308 190,294 234 C272 196,264 140,262 94 Z"/>
    <path d="M336 120 C354 154,358 194,346 228 C330 198,322 158,320 116 Z"/>
