</g>
<use href="#h" class="ln"/>

<!-- brow: sharp, angled, overhanging -->
<path class="st" d="M280 200 C328 192,372 208,398 232 C364 234,320 228,290 224
  C276 222,272 204,280 200 Z"/>
<!-- narrow angry eye -->
<path fill="#F5C23E" d="M298 240 C318 220,360 220,386 238 C362 256,322 258,298 240 Z"/>
<path class="st" d="M338 224 C352 224,360 233,360 245 C360 257,352 264,340 264 C328 254,326 232,338 224 Z"/>
<path class="ln" stroke-width="10" d="M294 236 C316 214,364 214,392 236"/>
<path class="ln" stroke-width="5" d="M302 250 C324 262,358 262,382 250"/>

<!-- nose leather, seated at the top-front of the muzzle -->
<path fill="#8C4232" d="M462 248 C486 242,512 254,518 274 C522 294,504 306,484 302
  C464 298,454 264,462 248 Z"/>
<path class="ln" stroke-width="7" d="M462 248 C486 242,512 254,518 274 C522 294,504 306,484 302
  C464 298,454 264,462 248 Z"/>

<!-- snarl wrinkles, tight behind the nose -->
<g class="ln" stroke-width="7">
  <path d="M440 276 C450 262,464 254,478 252"/>
  <path d="M426 298 C438 282,456 272,472 270"/>
</g>

<!-- snarling mouth line -->
<path class="ln" stroke-width="8" d="M500 312 C488 332,462 346,430 353
