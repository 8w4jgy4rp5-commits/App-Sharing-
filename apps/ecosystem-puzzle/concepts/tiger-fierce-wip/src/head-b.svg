<!-- fang hanging over the lower lip -->
<path fill="#FFFBF0" d="M446 352 C460 352,468 364,468 380 C468 394,460 404,450 408
  C436 396,432 354,446 352 Z"/>
<path class="ln" stroke-width="6" d="M446 352 C460 352,468 364,468 380 C468 394,460 404,450 408
  C436 396,432 354,446 352 Z"/>

<!-- chin crease -->
<path class="ln" stroke-width="6" d="M486 372 C464 388,424 396,388 394"/>

<!-- whisker dots -->
<g fill="#4A2118" opacity=".5">
  <circle cx="452" cy="300" r="5"/><circle cx="474" cy="294" r="5"/><circle cx="446" cy="320" r="5"/>
  <circle cx="470" cy="316" r="5"/>
</g>
</svg>
