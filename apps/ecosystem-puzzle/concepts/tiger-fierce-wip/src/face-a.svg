  <path class="shd" d="M214 408 L330 452 L444 406 L432 442 L330 470 L228 440 Z"/>

  <!-- FOREHEAD: bold converging stripes -->
  <g class="st">
    <path d="M318 54 L346 54 L344 132 L356 196 L332 208 L314 138 Z"/>
    <path d="M262 62 L288 56 L300 140 L318 202 L294 210 L274 142 Z"/>
    <path d="M382 58 L408 66 L392 144 L374 204 L352 196 L370 136 Z"/>
    <path d="M206 84 L230 72 L252 148 L278 206 L256 218 L226 152 Z"/>
    <path d="M438 74 L462 88 L432 156 L400 206 L380 194 L412 142 Z"/>
    <path d="M160 128 L180 110 L214 174 L246 220 L226 234 L188 180 Z"/>
    <path d="M490 116 L510 136 L468 186 L432 224 L414 208 L454 166 Z"/>
    <!-- cheek stripes raking back from the muzzle -->
    <path d="M498 250 L516 268 L452 296 L406 306 L404 288 Z"/>
    <path d="M482 312 L498 332 L436 348 L400 348 L402 330 Z"/>
    <path d="M148 254 L130 272 L194 298 L240 308 L242 290 Z"/>
    <path d="M164 316 L148 336 L210 350 L246 350 L244 332 Z"/>
  </g>
</g>
<use href="#head" class="ln fat"/>

