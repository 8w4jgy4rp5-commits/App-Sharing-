<!-- ===== HEAD MASS ===== -->
<use href="#head" class="fur"/>
<g clip-path="url(#headC)">
  <!-- lit plane: forehead and near cheek catch the light -->
  <path class="lit" d="M330 58 L470 104 L506 200 L470 300 L360 268 L318 150 Z"/>
