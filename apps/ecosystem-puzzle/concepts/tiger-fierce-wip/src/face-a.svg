  <path class="shd" d="M164 130 L96 82 L72 144 L106 194 L156 176 Z"/>
  <path class="st" d="M156 136 L110 102 L94 144 L118 178 L152 166 Z"/>
  <path class="cream" d="M118 116 L142 134 L136 154 L112 140 Z"/>
