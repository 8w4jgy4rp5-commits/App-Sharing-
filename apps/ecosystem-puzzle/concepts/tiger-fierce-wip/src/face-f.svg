<!-- ===== HEAD ===== -->
<use href="#head" class="fur"/>
<g clip-path="url(#headC)">
  <!-- cel shadow: hard-edged, mid-tone, cut to describe the bone -->
  <path class="cel" d="M430 108 L548 190 L556 306 L588 356 L534 396 L556 424
    L470 470 L400 528 L430 470 L452 400 L448 300 L436 200 Z"/>
  <path class="cel" d="M170 300 L246 330 L300 402 L268 492 L196 436 L150 452
    L184 386 L142 352 Z"/>
