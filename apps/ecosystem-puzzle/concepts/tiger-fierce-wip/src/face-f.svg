  <path class="cel" d="M168 250 L360 276 L548 254 L552 288 L362 312 L170 284 Z"/>
  <!-- far side of the nose bridge -->
  <path class="cel" d="M404 268 L440 292 L452 346 L424 340 L412 300 Z"/>
  <!-- under the jaw -->
  <path class="deep" d="M300 486 L390 524 L470 466 L462 500 L388 544 L286 508 Z"/>

  <!-- markings: thin, sharp, elegant. brow marks double as eyebrows -->
  <g class="st">
    <path d="M366 122 L392 124 L384 196 L392 248 L366 252 L358 198 Z"/>
    <path d="M314 126 L338 122 L338 196 L352 248 L326 254 L312 200 Z"/>
    <path d="M418 126 L442 134 L424 200 L410 248 L386 242 L404 196 Z"/>
    <path d="M262 142 L284 132 L300 196 L314 244 L290 252 L268 198 Z"/>
    <path d="M470 148 L490 164 L458 214 L436 248 L416 240 L444 200 Z"/>
    <path d="M214 176 L232 160 L262 212 L286 250 L266 262 L236 218 Z"/>
    <path d="M516 184 L532 204 L492 240 L466 260 L450 248 L488 214 Z"/>
    <!-- cheek rakes -->
