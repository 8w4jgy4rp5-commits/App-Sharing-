    <path d="M198 382 L186 400 L246 410 L278 410 L276 392 Z"/>
    <path d="M540 330 L554 348 L496 366 L468 368 L470 350 Z"/>
    <path d="M528 392 L540 410 L490 416 L468 414 L470 398 Z"/>
  </g>
</g>
<use href="#head" class="ln"/>

<!-- ===== MUZZLE ===== -->
