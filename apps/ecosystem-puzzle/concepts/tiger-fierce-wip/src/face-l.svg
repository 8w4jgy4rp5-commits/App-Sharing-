<!-- ===== HEAD ===== -->
<use href="#head" class="fur"/>
<g clip-path="url(#headC)">
  <!-- the far plane turns away: one decisive sweep -->
  <path class="cel" d="M436 72 L532 170 L540 288 L570 330 L518 374 L544 404
    L468 462 L436 496 L448 430 L452 348 L442 244 L434 152 Z"/>
  <path class="deep" d="M492 106 L534 174 L542 288 L566 330 L522 368 L540 400
    L472 456 L448 482 L462 398 L472 268 L478 166 Z" opacity=".55"/>

  <!-- cheekbone: a tapered crescent that carves, not a patch -->
  <path class="cel" d="M164 276 C212 298,254 334,278 376 C272 396,258 404,244 398
    C230 354,200 308,158 286 Z"/>
  <path class="cel" d="M190 380 C220 388,248 402,266 422 C256 442,228 446,210 432
    C208 414,202 394,190 380 Z"/>
  <!-- brow ridge band -->
  <path class="cel" d="M176 228 L360 254 L540 230 L544 258 L362 284 L178 258 Z"/>
  <!-- nose bridge: a tapered wedge on the far flank of the bridge -->
  <path class="cel" d="M360 266 C380 296,396 330,402 362 C390 368,378 358,372 344
    C368 316,362 286,354 270 Z"/>
  <!-- under the chin: a sliver that hugs the contour, not a bib -->
  <path class="deep" d="M298 498 C318 524,344 540,372 542 C400 542,426 526,440 502
    C432 534,404 556,372 556 C338 554,310 530,298 498 Z" opacity=".55"/>
  <!-- jowl: gives the muzzle mass where it meets the cheek -->
  <path class="cel" d="M452 424 C464 442,466 462,458 480 C446 474,436 458,432 440
    C438 432,445 426,452 424 Z" opacity=".45"/>
  <!-- cheek fur, near side: soft strokes so the ruff reads as fur -->
  <g class="ln fine" opacity=".5">
    <path d="M210 388 C228 400,244 414,254 432"/>
    <path d="M202 358 C222 366,240 378,254 392"/>
  </g>

  <!-- markings: five on the brow, two rakes per cheek -->
  <g class="st">
    <path d="M370 86 L396 88 L390 148 L396 186 L372 190 L364 150 Z"/>
    <path d="M320 90 L344 86 L344 148 L356 186 L332 192 L318 152 Z"/>
    <path d="M422 90 L446 98 L430 152 L416 186 L394 180 L410 148 Z"/>
    <path d="M270 106 L292 96 L306 150 L318 184 L296 192 L276 152 Z"/>
    <path d="M470 112 L490 128 L460 166 L440 188 L422 180 L448 154 Z"/>
    <path d="M224 140 L242 124 L268 166 L288 192 L270 204 L244 170 Z"/>
    <path d="M512 150 L528 170 L492 196 L470 212 L456 202 L490 174 Z"/>
    <path d="M186 292 L172 308 L232 328 L262 332 L262 314 Z"/>
    <path d="M196 352 L184 370 L238 378 L266 378 L264 360 Z"/>
    <path d="M528 306 L542 324 L492 340 L468 342 L470 324 Z"/>
    <path d="M520 366 L532 384 L488 390 L470 388 L472 372 Z"/>
  </g>
</g>
<use href="#head" class="ln"/>

