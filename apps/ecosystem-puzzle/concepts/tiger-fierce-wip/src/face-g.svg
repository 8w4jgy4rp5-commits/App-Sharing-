  <path class="cel" d="M436 112 L534 202 L542 306 L570 352 L516 392 L538 418
    L458 464 L388 524 L420 460 L442 380 L438 280 L432 192 Z"/>
  <!-- under the near cheekbone: one wedge, nothing else -->
