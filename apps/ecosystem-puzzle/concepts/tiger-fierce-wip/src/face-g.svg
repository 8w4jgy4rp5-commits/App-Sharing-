    L192 384 L150 350 Z"/>
  <!-- the brow ridge throws a shallow band over both sockets -->
  <path class="cel" d="M176 256 L360 282 L538 258 L542 288 L362 314 L178 288 Z"/>
  <!-- far side of the nose bridge -->
  <path class="cel" d="M404 274 L438 298 L450 350 L424 344 L412 304 Z"/>
  <!-- under the jaw -->
  <path class="deep" d="M296 486 L388 522 L464 462 L456 496 L386 540 L282 506 Z"/>

  <!-- markings: thin, sharp, stopping short so the brows have room -->
