  <g class="ln fine" opacity=".5">
    <path d="M206 392 C224 404,240 420,250 438"/>
    <path d="M196 356 C216 364,234 376,248 390"/>
  </g>

  <!-- markings: five on the brow, two rakes per cheek -->
