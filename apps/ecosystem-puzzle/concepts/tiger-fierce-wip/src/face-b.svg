<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 680" width="700" height="680">
<style>
  .ln{stroke:#5A2617;stroke-linejoin:round;stroke-linecap:round;fill:none;stroke-width:9}
  .fat{stroke-width:14}
  .fur{fill:#EC7D3E}.lit{fill:#F3A057}.shd{fill:#B0521F}.deep{fill:#6B2C14}
  .cream{fill:#FBEEDB}.st{fill:#2B150E}
</style>
<defs>
  <!-- 3/4: centre line at x=380, near (left) side wide, far (right) side foreshortened -->
  <path id="head" d="M348 58
    L430 66 L486 96 L516 146
    L530 216 L520 268 L542 292 L508 316 L524 344 L486 366
    L462 408 L416 442 L360 456
    L296 452 L240 432 L196 400
    L156 372 L176 344 L138 316 L162 288 L126 260 L148 232
    L142 172 L170 116 L226 76 L286 60 Z"/>
  <clipPath id="headC"><use href="#head"/></clipPath>
</defs>

<!-- ===== EARS ===== -->
<!-- near ear (left): broad, pinned back -->
<path class="shd" d="M168 118 L92 76 L62 146 L96 208 L156 188 Z"/>
<path class="st" d="M160 126 L108 96 L86 146 L112 190 L152 176 Z"/>
<path class="cream" d="M116 114 L146 136 L138 160 L108 142 Z"/>
<path class="ln" d="M168 118 L92 76 L62 146 L96 208 L156 188 Z"/>
<!-- far ear (right): foreshortened, mostly edge-on -->
<path class="deep" d="M508 128 L570 96 L588 150 L556 196 L512 180 Z"/>
<path class="st" d="M514 136 L560 110 L572 150 L550 184 L518 170 Z"/>
<path class="ln" d="M508 128 L570 96 L588 150 L556 196 L512 180 Z"/>

<!-- ===== HEAD MASS ===== -->
<use href="#head" class="fur"/>
<g clip-path="url(#headC)">
  <!-- light from the upper left: near cheek and forehead catch it -->
  <path class="lit" d="M340 50 L150 160 L130 268 L200 402 L300 448 L352 300 L336 150 Z"/>
  <!-- one clean hard-edged shadow wedge down the far side -->
  <path class="shd" d="M404 48 L536 150 L548 296 L506 404 L420 452 L392 440
    L438 330 L428 176 Z"/>
  <path class="deep" d="M452 78 L536 154 L548 296 L512 396 L466 428 L470 320 L458 190 Z"/>
  <!-- brow casts across both sockets -->
  <path class="deep" opacity=".5" d="M134 212 L380 260 L534 208 L540 262 L380 306 L136 258 Z"/>
  <!-- under the jaw -->
  <path class="shd" d="M214 414 L360 458 L470 404 L456 444 L358 476 L232 442 Z"/>

  <!-- forehead: the tiger brand, bold and converging -->
  <g class="st">
    <path d="M362 48 L392 48 L388 128 L398 206 L368 214 L356 130 Z"/>
    <path d="M304 54 L332 50 L340 130 L356 208 L326 214 L312 132 Z"/>
    <path d="M420 54 L448 62 L430 134 L410 206 L382 200 L404 128 Z"/>
    <path d="M246 74 L272 64 L292 140 L318 210 L290 220 L262 142 Z"/>
    <path d="M474 76 L498 92 L464 154 L434 208 L410 198 L444 140 Z"/>
    <path d="M186 110 L206 92 L242 160 L272 214 L248 228 L212 172 Z"/>
    <!-- the cross bar that makes it read as deliberate marking, not noise -->
    <path d="M232 150 L500 138 L504 164 L236 178 Z"/>
    <!-- cheek rakes -->
    <path d="M150 268 L132 286 L206 316 L258 326 L258 302 Z"/>
    <path d="M168 336 L150 356 L222 370 L266 370 L262 346 Z"/>
    <path d="M524 276 L540 294 L480 316 L446 320 L448 300 Z"/>
    <path d="M508 340 L522 358 L466 368 L440 366 L442 348 Z"/>
  </g>
</g>
<use href="#head" class="ln fat"/>

<!-- ===== MUZZLE ===== -->
<path class="cream" d="M388 262 L462 278 L502 322 L494 378 L440 412 L386 420
  L320 412 L278 376 L276 320 L318 278 Z"/>
<path fill="#D6BC97" d="M388 262 L462 278 L502 322 L494 378 L440 412 L386 420
  L400 350 L398 300 Z"/>
<path class="ln" d="M388 262 L462 278 L502 322 L494 378 L440 412 L386 420
  L320 412 L278 376 L276 320 L318 278 Z"/>

<!-- nose: broad, planted on the muzzle -->
<path fill="#8C4433" d="M386 254 L444 282 L448 320 L386 338 L328 320 L334 282 Z"/>
<path fill="#63291E" d="M386 254 L444 282 L448 320 L386 338 Z"/>
<path class="ln" d="M386 254 L444 282 L448 320 L386 338 L328 320 L334 282 Z"/>
<g class="ln" stroke-width="7">
  <path d="M354 308 L366 320"/><path d="M420 308 L408 320"/>
</g>

<!-- snarl folds -->
<g class="ln" stroke-width="8">
  <path d="M310 296 L288 282"/><path d="M304 324 L278 314"/>
  <path d="M464 300 L486 288"/><path d="M470 326 L494 318"/>
</g>

<!-- ===== MOUTH ===== -->
<path fill="#4A1A18" d="M386 358 L462 372 L478 412 L386 440 L296 412 L312 372 Z"/>
<path fill="#B4606A" d="M386 400 L440 392 L456 412 L386 428 L318 412 L334 392 Z"/>
<g fill="#FFFBF2">
  <path d="M330 364 L306 380 L318 432 L344 400 Z"/>
  <path d="M444 370 L468 386 L454 434 L430 404 Z"/>
</g>
<g class="ln" stroke-width="7">
  <path d="M330 364 L306 380 L318 432 L344 400 Z"/>
  <path d="M444 370 L468 386 L454 434 L430 404 Z"/>
</g>
<path class="ln" stroke-width="11" d="M282 378 L324 354 L386 348 L450 358 L490 384"/>

<!-- ===== BROW: one heavy V pressing onto the eyes ===== -->
<path class="st" d="M128 190 L242 200 L382 246 L488 196 L544 174 L552 220
  L490 244 L382 292 L240 242 L124 234 Z"/>

<!-- ===== EYES ===== -->
<!-- near eye (left, larger) -->
<path fill="#F7C63C" d="M190 232 L250 214 L314 244 L324 266 L256 270 L200 254 Z"/>
<path fill="#1C0E08" d="M256 228 L288 236 L296 258 L268 268 L248 254 Z"/>
<circle cx="281" cy="240" r="7" fill="#FFFFFF"/>
<path class="ln fat" d="M186 230 L250 208 L318 240 L330 264"/>
<path class="ln" stroke-width="7" d="M196 256 L246 272 L306 272 L330 262"/>
<!-- far eye (right, foreshortened) -->
<path fill="#F7C63C" d="M520 230 L472 216 L430 240 L424 262 L470 266 L512 252 Z"/>
<path fill="#1C0E08" d="M470 230 L444 238 L440 256 L464 264 L482 252 Z"/>
<circle cx="452" cy="240" r="6" fill="#FFFFFF"/>
<path class="ln fat" d="M526 228 L472 210 L426 236 L418 260"/>
<path class="ln" stroke-width="7" d="M518 256 L474 270 L434 268 L418 258"/>

<!-- whisker dots -->
<g fill="#5A2617" opacity=".45">
  <circle cx="316" cy="332" r="5"/><circle cx="296" cy="344" r="5"/>
  <circle cx="458" cy="336" r="5"/><circle cx="478" cy="348" r="5"/>
</g>
</svg>
