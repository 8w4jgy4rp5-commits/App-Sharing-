<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Daily Summary | CobbleWorks</title>
    <link rel="stylesheet" href="style.css" />
              <!-- cobbleworks:seo:start -->
    <meta name="description" content="A private notebook for the little things you can't say out loud." />
    <link rel="canonical" href="https://8w4jgy4rp5-commits.github.io/App-Sharing-/apps/daily-summary/" />
    <link rel="stylesheet" href="../../app-footer.css" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Daily Summary" />
    <meta property="og:description" content="A private notebook for the little things you can't say out loud." />
    <meta property="og:url" content="https://8w4jgy4rp5-commits.github.io/App-Sharing-/apps/daily-summary/" />
    <meta property="og:image" content="https://8w4jgy4rp5-commits.github.io/App-Sharing-/og-image.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
  <!-- cobbleworks:seo:end -->
  </head>
  <body>
    <header>
      <h1><span data-i18n="titlePart1">Daily</span> <span class="title-accent" data-i18n="titlePart2">Summary</span></h1>
      <p data-i18n="subtitle">A private notebook for the little things you can't say out loud.</p>
      <p class="privacy-note" data-i18n="privacyNote">🔒 Saved only in this device's browser.</p>
    </header>

    <main>
      <div class="book-tabs" role="tablist" data-i18n-aria-label="notebookPages" aria-label="Notebook pages">
        <button type="button" id="writeTabBtn" class="tab-btn active" role="tab" aria-selected="true" aria-controls="writePage" data-i18n="writeTab">Write</button>
        <button type="button" id="reflectTabBtn" class="tab-btn" role="tab" aria-selected="false" aria-controls="reflectPage" data-i18n="reflectTab">Reflect</button>
      </div>

      <div class="book">
        <section id="reflectPage" class="page page-left" role="tabpanel" aria-labelledby="reflectTabBtn">
          <h2 id="reflectHeading" class="page-heading" tabindex="-1" data-i18n="pastEntries">Past entries</h2>
          <div class="entries-scroll">
            <p id="emptyState" class="empty-state" hidden data-i18n="emptyState">
              No entries yet. Write your first one on the right.
            </p>
            <div id="entriesList"></div>
          </div>
        </section>

        <section id="writePage" class="page page-right page--active" role="tabpanel" aria-labelledby="writeTabBtn">
          <h2 class="page-heading" data-i18n="today">Today</h2>
          <form id="writeForm">
            <label for="entryText" class="sr-only" data-i18n="writeEntryLabel">Write a new entry</label>
            <textarea
              id="entryText"
              data-i18n-placeholder="entryPlaceholder"
              placeholder="What's on your mind today?"
              rows="10"
              required
            ></textarea>
            <button type="submit" class="primary-btn" data-i18n="writeBtn">Write</button>
          </form>
        </section>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../supabase-config.js"></script>
    <script src="../../app-sync.js"></script>
    <script src="script.js"></script>
              <!-- cobbleworks:footer:start -->
    <footer class="cw-footer">
      <a href="../../">Made on CobbleWorks — browse other mini apps</a>
    </footer>
  <!-- cobbleworks:footer:end -->
  </body>
</html>
