<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Unit Converter | CobbleWorks</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  <!-- cobbleworks:seo:start -->
    <meta name="description" content="Convert length, weight, temperature and volume in one place. Free, and it keeps working offline." />
    <link rel="canonical" href="https://8w4jgy4rp5-commits.github.io/App-Sharing-/apps/unit-converter/" />
    <link rel="stylesheet" href="../../app-footer.css" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Unit Converter" />
    <meta property="og:description" content="Convert length, weight, temperature and volume in one place. Free, and it keeps working offline." />
    <meta property="og:url" content="https://8w4jgy4rp5-commits.github.io/App-Sharing-/apps/unit-converter/" />
    <meta property="og:image" content="https://8w4jgy4rp5-commits.github.io/App-Sharing-/og-image.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
  <!-- cobbleworks:seo:end -->
  </head>
  <body>
    <header>
      <div class="app-icon" aria-hidden="true">
        <span class="app-icon-square"></span>
        <span class="app-icon-circle"></span>
        <span class="app-icon-symbol">⇄</span>
      </div>
      <div class="header-text">
        <h1 data-i18n="title">Unit Converter</h1>
        <p data-i18n="subtitle">length · weight · temp · volume</p>
      </div>
    </header>

    <main>
      <section class="convert-card">
        <div class="form-group">
          <label for="categorySelect" data-i18n="categoryLabel">Category</label>
          <select id="categorySelect">
            <option value="length" data-i18n="categoryLength">Length</option>
            <option value="weight" data-i18n="categoryWeight">Weight</option>
            <option value="temperature" data-i18n="categoryTemperature">Temperature</option>
            <option value="volume" data-i18n="categoryVolume">Volume</option>
          </select>
        </div>

        <div class="convert-row">
          <div class="form-group">
            <label for="fromValue" data-i18n="fromLabel">From</label>
            <input
              type="number"
              id="fromValue"
              inputmode="decimal"
              data-i18n-placeholder="fromPlaceholder"
              placeholder="e.g. 1"
            />
            <select id="fromUnit"></select>
          </div>

          <button type="button" id="swapBtn" class="swap-btn" data-i18n-aria-label="swapUnits" aria-label="Swap units">
            ⇄
          </button>

          <div class="form-group">
            <label for="toValue" data-i18n="toLabel">To</label>
            <input type="text" id="toValue" readonly data-i18n-placeholder="toPlaceholder" placeholder="—" />
            <select id="toUnit"></select>
          </div>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
  <!-- cobbleworks:footer:start -->
    <footer class="cw-footer">
      <a href="../../">Made on CobbleWorks — browse other mini apps</a>
    </footer>
  <!-- cobbleworks:footer:end -->
  </body>
</html>
