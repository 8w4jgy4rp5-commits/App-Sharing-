<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M12 2c1 3-2 4-2 7a4 4 0 0 0 8 0c1.5 1.5 2 3.3 2 5a8 8 0 1 1-13-6.2C8.5 6.5 11 5 12 2Z' fill='%23E8792E'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="style.css" />
  <!-- cobbleworks:seo:start -->
    <meta name="description" content="Keep track of the habits you're building, one check-in at a time." />
    <link rel="canonical" href="https://8w4jgy4rp5-commits.github.io/App-Sharing-/apps/habit-tracker/" />
    <link rel="stylesheet" href="../../app-footer.css" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Habit Tracker" />
    <meta property="og:description" content="Keep track of the habits you're building, one check-in at a time." />
    <meta property="og:url" content="https://8w4jgy4rp5-commits.github.io/App-Sharing-/apps/habit-tracker/" />
    <meta property="og:image" content="https://8w4jgy4rp5-commits.github.io/App-Sharing-/og-image.jpg" />

  </head>
  <body>
    <header>
      <h1>
        <svg class="title-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 2c1 3-2 4-2 7a4 4 0 0 0 8 0c1.5 1.5 2 3.3 2 5a8 8 0 1 1-13-6.2C8.5 6.5 11 5 12 2Z" fill="currentColor"/>
        </svg>
        <span class="title-plain">Habit</span> <span class="title-accent">Tracker</span>
      </h1>
      <p>Keep track of the habits you're building, one check-in at a time.</p>
    </header>

    <main>
      <section class="card" id="add-card">
        <h2 class="card-label">Add a habit</h2>
        <form id="habit-form" class="inline-form">
          <div class="form-group form-group-grow">
            <label for="habit-name">Habit name</label>
            <input type="text" id="habit-name" placeholder="e.g. Read for 20 minutes" required />
          </div>
          <button type="submit" class="btn btn-primary">Add habit</button>
        </form>
        <p id="form-error" class="form-error" role="alert"></p>
      </section>

      <section id="habit-section">
        <h2 class="card-label">Your habits</h2>
        <ul id="habit-list" class="habit-list"></ul>
        <p id="empty-state" class="empty-state">
          No habits yet. Add your first one above to start building a streak.
        </p>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../supabase-config.js"></script>
    <script src="../../app-sync.js"></script>
    <script src="script.js"></script>
  <!-- cobbleworks:footer:start -->
    <footer class="cw-footer">
      <a href="../../">Made on CobbleWorks — browse other mini apps</a>
    </footer>
  <!-- cobbleworks:footer:end -->
  </body>
</html>
