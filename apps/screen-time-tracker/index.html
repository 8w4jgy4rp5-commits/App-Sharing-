  <body>
    <header>
      <h1>
        <svg class="title-icon" viewBox="0 0 24 24" aria-hidden="true">
          <rect x="6" y="2" width="12" height="20" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.6"/>
          <circle cx="12" cy="12" r="4.2" fill="none" stroke="currentColor" stroke-width="1.6"/>
          <path d="M12 9.6V12l1.8 1.2" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="title-plain">Screen Time</span> <span class="title-accent">Tracker</span>
      </h1>
      <p>Set a daily screen time goal and log how you actually did.</p>
    </header>

    <main>
      <section class="card" id="goal-card">
        <h2 class="card-label">Daily goal</h2>
        <form id="goal-form" class="inline-form">
          <div class="time-input-group">
            <div class="form-group">
              <label for="goal-hours">Hours</label>
              <input type="number" id="goal-hours" min="0" max="23" placeholder="0" inputmode="numeric" />
            </div>
            <div class="form-group">
              <label for="goal-minutes">Minutes</label>
              <input type="number" id="goal-minutes" min="0" max="59" placeholder="0" inputmode="numeric" />
            </div>
          </div>
          <button type="submit" class="btn btn-primary">Save goal</button>
        </form>
        <p id="goal-display" class="goal-display"></p>
      </section>

      <section class="card" id="entry-card">
        <h2 class="card-label">Log today's screen time</h2>
        <form id="entry-form" class="inline-form">
          <div class="form-group">
            <label for="entry-date">Date</label>
            <input type="date" id="entry-date" required />
          </div>
          <div class="time-input-group">
            <div class="form-group">
              <label for="entry-hours">Hours</label>
              <input type="number" id="entry-hours" min="0" max="23" placeholder="0" inputmode="numeric" />
            </div>
            <div class="form-group">
              <label for="entry-minutes">Minutes</label>
              <input type="number" id="entry-minutes" min="0" max="59" placeholder="0" inputmode="numeric" />
            </div>
          </div>
          <button type="submit" class="btn btn-primary">Add log</button>
        </form>
        <p id="form-error" class="form-error" role="alert"></p>
      </section>

      <section class="card" id="summary-card" hidden>
        <h2 class="card-label">Summary</h2>
        <p id="summary-text"></p>
      </section>

      <section id="log-section">
        <h2 class="card-label">History</h2>
        <ul id="log-list" class="log-list"></ul>
        <p id="empty-state" class="empty-state">
          No logs yet. Set a goal above and add your first entry to get started.
        </p>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../supabase-config.js"></script>
    <script src="../../app-sync.js"></script>
    <script src="script.js"></script>
  <!-- cobbleworks:footer:start -->
    <footer class="cw-footer">

  <!-- cobbleworks:footer:end -->
  </body>
</html>
