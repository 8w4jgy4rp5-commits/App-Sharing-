  </head>
  <body>
    <header class="app-header">
      <svg class="app-icon" viewBox="0 0 64 64" aria-hidden="true">
        <rect width="64" height="64" rx="14" fill="#D64545" />
        <path d="M18 30h28v6a14 14 0 0 1-14 14 14 14 0 0 1-14-14v-6z" fill="#fff" />
        <path d="M14 30h36" stroke="#fff" stroke-width="3" stroke-linecap="round" />
        <path
          d="M14 30v-2a4 4 0 0 1 4-4M50 30v-2a4 4 0 0 0-4-4"
          fill="none"
          stroke="#fff"
          stroke-width="3"
          stroke-linecap="round"
        />
        <path
          d="M27 16c-2 3 2 4 0 7M35 16c-2 3 2 4 0 7"
          stroke="#fff"
          stroke-width="2.5"
          stroke-linecap="round"
          opacity="0.7"
        />
      </svg>
      <div class="header-text">
        <h1 class="app-title" data-i18n="title">What to Cook</h1>
        <p class="app-subtitle" data-i18n="subtitle">Stuck in front of the fridge? Get a random pick from your go-to meals.</p>
      </div>
    </header>

    <main>
      <section class="map-card suggest-section">
        <h2 class="section-title" data-i18n="suggestSectionTitle">Tonight's Pick</h2>
        <label for="filter-select" class="field-label" data-i18n="filterLabel">Filter</label>
        <select id="filter-select">
          <option value="" data-i18n="filterAll">All meals</option>
          <option value="quick" data-i18n="filterQuick">Quick (under 20 min)</option>
          <option value="vegetarian" data-i18n="filterVegetarian">Vegetarian</option>
          <option value="oven" data-i18n="filterOven">Needs Oven</option>
          <option value="leftovers" data-i18n="filterLeftovers">Uses Leftovers</option>
          <option value="comfort" data-i18n="filterComfort">Comfort Food</option>
        </select>

        <div id="suggestion-result" class="suggestion-result" hidden>
          <p id="suggestion-name" class="suggestion-name"></p>
          <div id="suggestion-tags" class="tag-row"></div>
        </div>

        <p id="suggest-empty" class="helper-text" hidden></p>

        <div class="btn-row">
          <button type="button" id="suggest-btn" class="primary-btn" data-i18n="suggestBtn">Suggest Something</button>
        </div>
      </section>

      <section class="map-card add-section">
        <h2 class="section-title" data-i18n="addSectionTitle">Add a Go-To Meal</h2>
        <form id="add-form" novalidate>
          <label for="meal-input" class="field-label" data-i18n="mealNameLabel">Meal name</label>
          <input
            id="meal-input"
            class="map-input"
            type="text"
            maxlength="80"
            data-i18n-placeholder="mealNamePlaceholder"
            placeholder="e.g. Chicken stir-fry"
            autocomplete="off"
          />

          <p class="field-label" data-i18n="tagsLabel">Tags (optional)</p>
          <div class="tag-checkboxes">
            <label class="tag-checkbox"><input type="checkbox" value="quick" /> <span data-i18n="tagQuick">Quick</span></label>
            <label class="tag-checkbox"><input type="checkbox" value="vegetarian" /> <span data-i18n="tagVegetarian">Vegetarian</span></label>
            <label class="tag-checkbox"><input type="checkbox" value="oven" /> <span data-i18n="tagOven">Needs Oven</span></label>
            <label class="tag-checkbox"><input type="checkbox" value="leftovers" /> <span data-i18n="tagLeftovers">Uses Leftovers</span></label>
            <label class="tag-checkbox"><input type="checkbox" value="comfort" /> <span data-i18n="tagComfort">Comfort Food</span></label>
          </div>

          <p id="error-msg" class="error-msg" role="alert" hidden></p>

          <div class="btn-row">
            <button type="submit" class="primary-btn" data-i18n="addMealBtn">Add Meal</button>
          </div>
        </form>
      </section>

      <section class="list-section">
        <h2 class="section-title" data-i18n="yourMealsTitle">Your Go-To Meals</h2>
        <ul id="meal-list" class="meal-list"></ul>

        <div id="empty-state" class="empty-state" hidden>
          <svg viewBox="0 0 80 80" class="empty-illustration" aria-hidden="true">
            <path
              d="M22 37h36v7a18 18 0 0 1-18 18 18 18 0 0 1-18-18v-7z"
              fill="none"
              stroke="#F0C4BE"
              stroke-width="3"
            />
            <path d="M18 37h44" stroke="#F0C4BE" stroke-width="3" stroke-linecap="round" />
          </svg>
          <p></p>
        </div>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../supabase-config.js"></script>
    <script src="../../app-sync.js"></script>
    <script src="script.js"></script>
  <!-- cobbleworks:footer:start -->
    <footer class="cw-footer">
      <a href="../../">Made on CobbleWorks — browse other mini apps</a>
    </footer>
  <!-- cobbleworks:footer:end -->
  </body>
</html>
