<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Micro Stretch | CobbleWorks</title>
    <link rel="stylesheet" href="style.css" />
  <!-- cobbleworks:seo:start -->
    <meta name="description" content="Quick stretches you can do in a spare moment." />
    <link rel="canonical" href="https://8w4jgy4rp5-commits.github.io/App-Sharing-/apps/micro-stretch/" />
    <link rel="stylesheet" href="../../app-footer.css" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Micro Stretch" />
    <meta property="og:description" content="Quick stretches you can do in a spare moment." />
    <meta property="og:url" content="https://8w4jgy4rp5-commits.github.io/App-Sharing-/apps/micro-stretch/" />
    <meta property="og:image" content="https://8w4jgy4rp5-commits.github.io/App-Sharing-/og-image.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
  <!-- cobbleworks:seo:end -->
  </head>
  <body>
    <header>
      <h1 data-i18n="title">Micro Stretch</h1>
      <p data-i18n="subtitle">Quick stretches you can do in a spare moment.</p>
    </header>

    <main>
      <!-- Stretch picker -->
      <section id="stretch-section">
        <button type="button" id="showStretchBtn" class="primary-btn" data-i18n="showStretch">Show me a stretch</button>

        <div id="stretchCard" class="stretch-card" hidden>
          <p id="stretchName" class="stretch-name"></p>
          <p id="stretchDuration" class="stretch-duration"></p>
          <ol id="stretchSteps" class="stretch-steps"></ol>
        </div>

        <div id="stretchActions" class="stretch-actions" hidden>
          <button type="button" id="doneBtn" class="primary-btn" data-i18n="done">Done ✓</button>
          <button type="button" id="anotherBtn" class="secondary-btn" data-i18n="showAnother">Show another</button>
        </div>

        <p id="doneConfirmation" class="confirmation" hidden data-i18n="doneConfirmation">Nice! Recorded ✓</p>
      </section>

      <!-- Records -->
      <section id="records-section">
        <h2 data-i18n="recordsHeading">Records</h2>
        <div class="records-row">
          <p id="todayRecord" class="record-line">Today: 0</p>
          <p id="totalRecord" class="record-line">Total: 0</p>
        </div>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../supabase-config.js"></script>
    <script src="../../app-sync.js"></script>
    <script src="script.js"></script>
  <!-- cobbleworks:footer:start -->
    <footer class="cw-footer">
      <a href="../../">Made on CobbleWorks — browse other mini apps</a>
    </footer>
  <!-- cobbleworks:footer:end -->
  </body>
</html>
